[package]
name = "sci-complex"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Complex-number utilities for scientific computing"
documentation = "https://docs.rs/sci-complex"
