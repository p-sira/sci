[package]
name = "sci-io"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bounded scientific file interchange for Sci"
repository.workspace = true
readme = false
include = ["/src/**", "/LICENSE"]

[features]
default = ["matrix-market", "wav", "matlab"]
matrix-market = []
wav = ["dep:hound"]
matlab = ["dep:flate2"]

[dependencies]
sci-core.workspace = true
hound = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
