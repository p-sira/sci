[package]
name = "sci-io"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bounded scientific file interchange for Sci"
repository.workspace = true
include = ["/CHANGELOG.md", "/src/**", "/LICENSE"]

[features]
default = ["matrix-market", "wav", "matlab"]
matrix-market = ["dep:sci-sparse"]
wav = ["dep:hound"]
matlab = ["dep:matrw", "dep:flate2"]

[dependencies]
sci-core.workspace = true
sci-sparse = { workspace = true, optional = true }
hound = { workspace = true, optional = true }
matrw = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
