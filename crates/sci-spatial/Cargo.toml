[package]
name = "sci-spatial"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Spatial geometry and nearest-neighbor methods"
documentation = "https://docs.rs/sci-spatial"
homepage = "https://github.com/p-sira/sci"
repository = "https://github.com/p-sira/sci"
categories = ["algorithms", "mathematics", "science"]
keywords = ["spatial", "geometry", "nearest-neighbor", "numerics", "scientific-computing"]
include = ["src/**", "LICENSE"]

[dependencies]
sci-core.workspace = true
nalgebra.workspace = true

[dev-dependencies]
sci-linalg = { path = "../sci-linalg", default-features = false }
