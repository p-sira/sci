[package]
name = "sci-differentiate"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Numerical differentiation and derivatives"
documentation = "https://docs.rs/sci-differentiate"
homepage = "https://github.com/p-sira/sci"
repository = "https://github.com/p-sira/sci"
categories = ["mathematics", "science"]
keywords = ["differentiation", "derivatives", "calculus", "numerics", "scientific-computing"]
readme = false
include = ["/src/**", "/LICENSE"]

[dependencies]
numeric_literals.workspace = true
sci-core.workspace = true

[dev-dependencies]
sci-linalg = { path = "../sci-linalg", default-features = false }
sci-optimize = { path = "../sci-optimize" }
