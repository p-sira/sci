[package]
name = "sci-fft"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fast Fourier and discrete cosine transforms"
documentation = "https://docs.rs/sci-fft"
homepage = "https://github.com/p-sira/sci"
repository = "https://github.com/p-sira/sci"
categories = ["algorithms", "mathematics", "science"]
keywords = ["fft", "fourier-transform", "signal-processing", "numerics", "dct"]
readme = false
include = ["/src/**", "/LICENSE", "/LICENSES/**"]

[features]
default = ["hankel"]
hankel = ["dep:special"]

[dependencies]
sci-core.workspace = true
sci-complex.workspace = true
num-complex.workspace = true
rustfft.workspace = true
realfft.workspace = true
rustdct.workspace = true
special = { workspace = true, optional = true }
