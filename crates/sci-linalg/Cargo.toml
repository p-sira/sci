[package]
name = "sci-linalg"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Linear algebra for scientific computing"
documentation = "https://docs.rs/sci-linalg"
homepage = "https://github.com/p-sira/sci"
repository = "https://github.com/p-sira/sci"
categories = ["algorithms", "mathematics", "science"]
keywords = ["linear-algebra", "matrices", "numerics", "scientific-computing", "faer"]
readme = false
include = ["/src/**", "/LICENSE"]

[features]
default = ["faer"]
# Interoperability adapters; faer remains the numerical backend with any selection.
faer = []
nalgebra = ["dep:nalgebra"]
ndarray = ["dep:ndarray"]

[dependencies]
sci-core.workspace = true
sci-complex.workspace = true
sci-special.workspace = true
dyn-stack.workspace = true
faer.workspace = true
nalgebra = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
num-complex.workspace = true

[dev-dependencies]
sci-differentiate = { path = "../sci-differentiate" }
sci-signal = { path = "../sci-signal" }
