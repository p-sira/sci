[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Sira Pornsiriprasert <code@psira.me>"]
license = "BSD-3-Clause"
rust-version = "1.89"
description = "Unified scientific computation for Rust"
documentation = "https://docs.rs/sci"
homepage = "https://github.com/p-sira/sci"
repository = "https://github.com/p-sira/sci"

categories = ["science", "mathematics"]

[workspace.dependencies]
hound = "3.5.1"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
rand = { version = "0.9.2", default-features = false, features = ["std", "std_rng"] }
smelly = "=0.2.0"
basin = { version = "1.15.1", default-features = false }
ellip = "1.2.2"
ndarray = "0.16.1"
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
num-complex = "0.4.6"
rustfft = "6.4.0"
realfft = "3.5.0"
special = { version = "0.14.2", default-features = false, features = ["std"] }
statrs = { version = "0.19.1", default-features = false, features = ["std", "nalgebra"] }
lapjv = "0.3.0"
xsf = "0.6.0"
pm-remez = { version = "=0.3.5", default-features = false, features = ["nalgebra-backend"] }
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg"] }
dyn-stack = "0.13.2"
kodama = "0.3.0"
rustdct = "0.7.1"
splinefit = "0.4.1"
delaunator = "1.1.0"
sci-io = { version = "0.1.1", path = "crates/sci-io", default-features = false }
sci-core = { version = "0.2.0", path = "crates/sci-core" }
sci-cluster = { version = "0.2.0", path = "crates/sci-cluster" }
sci-complex = { version = "0.2.0", path = "crates/sci-complex" }
sci-constants = { version = "0.2.0", path = "crates/sci-constants" }
sci-differentiate = { version = "0.2.0", path = "crates/sci-differentiate" }
sci-fft = { version = "0.2.0", path = "crates/sci-fft", default-features = false }
sci-filter = { version = "0.2.1", path = "crates/sci-filter" }
sci-integrate = { version = "0.2.0", path = "crates/sci-integrate" }
sci-interpolate = { version = "0.2.1", path = "crates/sci-interpolate" }
sci-linalg = { version = "0.2.1", path = "crates/sci-linalg", default-features = false }
sci-optimize = { version = "0.2.0", path = "crates/sci-optimize" }
sci-signal = { version = "0.2.1", path = "crates/sci-signal" }
sci-sparse = { version = "0.1.1", path = "crates/sci-sparse", default-features = false }
sci-spatial = { version = "0.2.1", path = "crates/sci-spatial" }
sci-special = { version = "0.2.1", path = "crates/sci-special" }
sci-stats = { version = "0.2.1", path = "crates/sci-stats" }

[package]
name = "sci"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Unified scientific computation for Rust"
documentation = "https://docs.rs/sci"
homepage = "https://github.com/p-sira/sci"
repository = "https://github.com/p-sira/sci"
categories = ["mathematics", "science"]
keywords = ["scientific-computing", "numerics", "mathematics", "optimization", "statistics"]
readme = false
include = ["/src/**", "/LICENSE"]
autotests = false

[features]
default = ["fft-hankel", "io-matrix-market", "io-wav", "io-matlab", "sparse-npz", "cluster", "complex", "constants", "differentiate", "filter", "fft", "integrate", "interpolate", "io", "linalg", "linalg-faer", "linalg-nalgebra", "linalg-ndarray", "optimize", "signal", "sparse", "spatial", "special", "stats"]
cluster = ["dep:sci-cluster"]
complex = ["dep:sci-complex"]
constants = ["dep:sci-constants"]
differentiate = ["dep:sci-differentiate"]
filter = ["dep:sci-filter"]
fft = ["dep:sci-fft"]
fft-hankel = ["fft", "sci-fft/hankel"]
io = ["dep:sci-io"]
io-matrix-market = ["io", "sci-io/matrix-market"]
io-wav = ["io", "sci-io/wav"]
io-matlab = ["io", "sci-io/matlab"]
integrate = ["dep:sci-integrate"]
interpolate = ["dep:sci-interpolate"]
linalg = ["dep:sci-linalg"]
linalg-faer = ["linalg", "sci-linalg/faer"]
linalg-nalgebra = ["linalg", "sci-linalg/nalgebra"]
linalg-ndarray = ["linalg", "sci-linalg/ndarray"]
optimize = ["dep:sci-optimize"]
signal = ["dep:sci-signal"]
sparse = ["dep:sci-sparse"]
sparse-npz = ["sparse", "sci-sparse/npz"]
spatial = ["dep:sci-spatial"]
special = ["dep:sci-special"]
stats = ["dep:sci-stats"]

[dependencies]
sci-io = { workspace = true, optional = true }
sci-filter = { workspace = true, optional = true }
sci-core.workspace = true
sci-cluster = { workspace = true, optional = true }
sci-complex = { workspace = true, optional = true }
sci-constants = { workspace = true, optional = true }
sci-differentiate = { workspace = true, optional = true }
sci-fft = { workspace = true, optional = true }
sci-integrate = { workspace = true, optional = true }
sci-interpolate = { workspace = true, optional = true }
sci-linalg = { workspace = true, optional = true }
sci-optimize = { workspace = true, optional = true }
sci-signal = { workspace = true, optional = true }
sci-sparse = { workspace = true, optional = true }
sci-spatial = { workspace = true, optional = true }
sci-special = { workspace = true, optional = true }
sci-stats = { workspace = true, optional = true }

[dev-dependencies]
approx = "0.5.1"
ndarray.workspace = true
nalgebra.workspace = true
faer.workspace = true
divan = { version = "5.0.3", package = "codspeed-divan-compat" }

[[test]]
name = "cluster"
path = "tests/cluster.rs"
required-features = ["cluster", "stats"]

[[test]]
name = "complex"
path = "tests/complex.rs"
required-features = ["complex", "fft"]

[[test]]
name = "differentiation"
path = "tests/differentiation.rs"
required-features = ["differentiate", "linalg"]

[[test]]
name = "fft_extended"
path = "tests/fft_extended.rs"
required-features = ["fft-hankel", "complex", "fft", "stats"]

[[test]]
name = "fft_periodic"
path = "tests/fft_periodic.rs"
