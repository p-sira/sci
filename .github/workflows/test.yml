name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.select.outputs.scope }}
      active: ${{ steps.select.outputs.active }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-scope
        id: select
      - name: Test CI selection
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all -- --check
      - run: python tests/scipy/case_catalog.py

  audits:
    if: false # Keep the SciPy coverage audits available for re-enabling.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit numerical inventory and reference coverage
        run: |
          for audit in tests/scipy/audit_*.py; do
            python "$audit"
          done

  features:
    needs: scope
    if: needs.scope.outputs.active == 'true'
    runs-on: ubuntu-latest
    env:
      CI_SCOPE: ${{ needs.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup-native
      - name: Check isolated modules and adapters
        run: python .github/scripts/ci_scope.py features

  test:
    needs: scope
    if: needs.scope.outputs.active == 'true'
    # A lost ARM runner previously remained in the test step for 47 minutes.
    # Bound an unresponsive job instead of consuming nearly an hour of CI.
    timeout-minutes: 20
    env:
      CI_SCOPE: ${{ needs.scope.outputs.scope }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - uses: ./.github/actions/setup-native
      - name: Run clippy
        run: python .github/scripts/ci_scope.py clippy
      - name: Limit ARM test resource contention
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
          echo "RUST_TEST_THREADS=2" >> "$GITHUB_ENV"
      - name: Run tests
        run: python .github/scripts/ci_scope.py test
      - name: Check core-only facade
        run: cargo check -p sci --no-default-features --locked
      - name: Check special-only facade
        if: fromJSON(env.CI_SCOPE).full || contains(fromJSON(env.CI_SCOPE).features, 'special')
        run: cargo check -p sci --no-default-features --features special --locked
      - name: Check docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: python .github/scripts/ci_scope.py doc
