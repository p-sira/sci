name: Publish
run-name: Publish ${{ inputs.crate }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      crate:
        description: Crate to publish
        required: true
        type: choice
        options:
          - sci
          - sci-cluster
          - sci-complex
          - sci-constants
          - sci-core
          - sci-differentiate
          - sci-fft
          - sci-filter
          - sci-integrate
          - sci-interpolate
          - sci-linalg
          - sci-optimize
          - sci-signal
          - sci-sparse
          - sci-spatial
          - sci-special
          - sci-stats
      version:
        description: "Version to publish (e.g 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sci-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_CRATE: ${{ inputs.crate }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        shell: python
        run: |
          import os
          import re

          number = r"(?:0|[1-9][0-9]*)"
          identifier = rf"(?:{number}|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          version = rf"{number}\.{number}\.{number}(?:-{identifier}(?:\.{identifier})*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
          if not re.fullmatch(version, os.environ["RELEASE_VERSION"]):
              raise SystemExit("Version must be an explicit SemVer value, e.g. 0.1.0 or 0.2.0-rc.1")
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - uses: ./.github/actions/setup-native
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests before publishing
        run: cargo test --workspace --locked
      - name: Configure Git identity
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
      - name: Install cargo-release
        run: |
          rustup update stable
          cargo install cargo-release --locked
      - name: Publish selected crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          cargo release --package "$RELEASE_CRATE" --allow-branch '*' "$RELEASE_VERSION" --no-tag --no-confirm --execute
