name: Publish
run-name: Publish ${{ inputs.crate }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      crate:
        description: Workspace or individual crate to publish
        required: true
        type: choice
        default: workspace
        options:
          - workspace
          - sci
          - sci-cluster
          - sci-complex
          - sci-constants
          - sci-core
          - sci-differentiate
          - sci-fft
          - sci-filter
          - sci-graph
          - sci-integrate
          - sci-interpolate
          - sci-io
          - sci-linalg
          - sci-optimize
          - sci-signal
          - sci-sparse
          - sci-spatial
          - sci-special
          - sci-stats
      version:
        description: "Prepared version (sci version for workspace releases)"
        required: true
        type: string
      dry_run:
        description: Validate packages without uploading
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sci-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_CRATE: ${{ inputs.crate }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require main for uploads
        if: ${{ !inputs.dry_run }}
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Validate prepared package versions
        shell: python
        run: |
          import json
          import os
          import subprocess

          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--no-deps", "--locked", "--format-version", "1"
          ]))
          packages = {p["name"]: p["version"] for p in metadata["packages"]}
          selected = os.environ["RELEASE_CRATE"]
          name = "sci" if selected == "workspace" else selected
          expected = os.environ["RELEASE_VERSION"]
          if packages.get(name) != expected:
              raise SystemExit(f"{name}: prepared version is {packages.get(name)}, expected {expected}")
          for crate, version in sorted(packages.items()):
              if selected == "workspace" or crate == selected:
                  print(f"{crate} {version}")
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests before publishing
        run: cargo test --workspace --locked
      - name: Verify workspace packages
        if: ${{ inputs.dry_run }}
        run: |
          if [ "$RELEASE_CRATE" = workspace ]; then
            cargo publish --workspace --locked --dry-run
          else
            cargo publish --package "$RELEASE_CRATE" --locked --dry-run
          fi
      - name: Publish prepared packages
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          if [ "$RELEASE_CRATE" = workspace ]; then
            cargo publish --workspace --locked
          else
            cargo publish --package "$RELEASE_CRATE" --locked
          fi
